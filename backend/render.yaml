services:
  - type: web
    name: guardian-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: bash start_render.sh
    healthCheckPath: /auth/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: OPENAI_API_KEY
        value: ""

databases:
  - name: guardian-db
    region: singapore
    plan: free
    databaseName: cloud_guardian
    user: guardian